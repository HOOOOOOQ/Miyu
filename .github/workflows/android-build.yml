name: Android build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.32.8"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Analyze, test & build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Gradle wrapper
        # Flutter injects a wrapper automatically if this cannot fetch one, so
        # a network hiccup here must not fail the build.
        continue-on-error: true
        run: bash tool/setup_android_wrapper.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Format check (advisory)
        # Non-blocking by design: formatting drift should not stop a build, but
        # the diff is printed so contributors can run `dart format lib test`.
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test || {
            echo "::warning::Dart formatting drift detected. Run 'dart format lib test' locally."
            dart format --output=show lib test | head -n 200
          }

      - name: Static analysis
        # pipefail: without it `| tee` returns tee's status, masking real failures.
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log

      - name: Unit & widget tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee /tmp/test.log

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The Google Services Gradle plugin is applied, so a placeholder is
          # required even when FCM is not configured — otherwise the build dies
          # with "File google-services.json is missing". Real values are never
          # committed; the placeholder only carries the package name.
          if [[ -n "${GOOGLE_SERVICES_JSON}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json configured from secrets — FCM enabled"
            exit 0
          fi
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "miyu-ci-placeholder",
              "storage_bucket": "miyu-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.miyu.messaging"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "::notice::GOOGLE_SERVICES_JSON not set — using a placeholder so the build can run; FCM stays disabled at runtime."

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          # pipefail: without it `| tee` returns tee's status and a failed
          # build is reported as success.
          set -o pipefail
          # Defaults mirror mobile/lib/config/app_config.dart so a build with no
          # repository variables still points at a real backend instead of a
          # placeholder host that never existed.
          flutter build apk --release --no-pub \
            --dart-define=API_BASE_URL="${API_BASE_URL:-http://play.notmemc.my.id:3186}" \
            --dart-define=SOCKET_URL="${SOCKET_URL:-http://play.notmemc.my.id:3186}" \
            --dart-define=APP_ENV="${APP_ENV:-production}" \
            --dart-define=APP_VERSION="${APP_VERSION:-1.0.0}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" 2>&1 | tee /tmp/build.log

      - name: Verify APK output
        id: apk
        run: |
          # Flutter has moved this path between versions, so discover it.
          echo '--- .apk files under build/ ---'
          find build -type f -name '*.apk' -exec ls -lh {} \; || true
          APK=$(find build -type f \( -name '*-release.apk' -o -name 'app-release.apk' \) | head -n 1)
          if [[ -z "$APK" ]]; then
            echo '::error::No release APK was produced.'
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyu-apk-${{ github.sha }}
          path: mobile/${{ steps.apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "### Miyu APK built"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Artifact: \`miyu-apk-${{ github.sha }}\`"
            echo "- Path inside artifact: \`${{ steps.apk.outputs.apk_path }}\`"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
