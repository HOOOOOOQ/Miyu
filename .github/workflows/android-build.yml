name: Android build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# TEMPORARY diagnostics: publish analyze failures as a commit comment.

env:
  FLUTTER_VERSION: "3.32.8"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Analyze, test & build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Gradle wrapper
        # Flutter injects a wrapper automatically if this cannot fetch one, so
        # a network hiccup here must not fail the build.
        continue-on-error: true
        run: bash tool/setup_android_wrapper.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Format check (advisory)
        # Non-blocking by design: formatting drift should not stop a build, but
        # the diff is printed so contributors can run `dart format lib test`.
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test || {
            echo "::warning::Dart formatting drift detected. Run 'dart format lib test' locally."
            dart format --output=show lib test | head -n 200
          }

      - name: Static analysis
        run: flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log

      - name: Publish analyzer output
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### flutter analyze'
            echo '```'
            grep -E "error •|warning •" /tmp/analyze.log 2>/dev/null | head -n 80 || tail -n 60 /tmp/analyze.log
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" || true

      - name: Unit & widget tests
        run: flutter test --no-pub --reporter expanded 2>&1 | tee /tmp/test.log

      - name: Publish test output
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### flutter test'
            echo '```'
            tail -n 100 /tmp/test.log 2>/dev/null || echo 'no log captured'
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" || true

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "${GOOGLE_SERVICES_JSON}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json configured — FCM enabled"
          else
            echo "::notice::GOOGLE_SERVICES_JSON not set — building without Firebase push"
          fi

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release --no-pub \
            --dart-define=API_BASE_URL="${API_BASE_URL:-https://api.miyu.app}" \
            --dart-define=SOCKET_URL="${SOCKET_URL:-https://api.miyu.app}" \
            --dart-define=APP_ENV="${APP_ENV:-production}" \
            --dart-define=APP_VERSION="${APP_VERSION:-1.0.0}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" 2>&1 | tee /tmp/build.log

      - name: Publish build output
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### flutter build apk'
            echo '```'
            grep -nE "FAILURE|What went wrong|error:|ERROR|Exception|Could not|Caused by" /tmp/build.log 2>/dev/null | head -n 60 || tail -n 80 /tmp/build.log
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" || true

      - name: Verify APK output
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyu-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "### Miyu APK built"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Artifact: \`miyu-apk-${{ github.sha }}\`"
            echo "- Path inside artifact: \`app-release.apk\`"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
