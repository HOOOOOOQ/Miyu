name: Backend checks

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, test & Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-value-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-value-not-for-production
      GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
      # DB-backed suites run against the service container below.
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/miyu_test
      MIYU_REQUIRE_DB: "1"

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate configuration module loads
        run: node -e "require('./src/config/env'); require('./src/app'); console.log('config OK')"

      - name: Run tests (real MongoDB service container)
        # MIYU_REQUIRE_DB=1 turns a missing database into a hard failure, so the
        # auth suite can never silently skip in CI.
        run: npm test -- --runInBand

      - name: Build Docker image
        run: docker build -t miyu-backend:ci .

  docker-smoke:
    name: Docker healthcheck smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t miyu-backend:ci backend

      - name: Start container
        run: docker run -d --name miyu-smoke -p 5000:5000 miyu-backend:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Health endpoint did not respond"
          docker logs miyu-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f miyu-smoke || true
