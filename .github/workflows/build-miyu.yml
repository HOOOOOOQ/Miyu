name: Build Miyu APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Miyu Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Setup Flutter (stable, compatible)
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.3

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format (auto-fix)
        run: dart format lib test 2>&1 | head -15 || true

      - name: Dart format check
        run: |
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee /tmp/fmt2.out || true
          echo "=== FMT OUT (annotations) ==="
          grep -E "." /tmp/fmt2.out 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit 0

      - name: Flutter analyze
        run: |
          flutter analyze 2>&1 | tee /tmp/an.out || true
          echo "=== ANALYZE OUT (annotations) ==="
          grep -E "." /tmp/an.out 2>/dev/null | head -60 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit 0

      - name: Flutter test
        run: |
          flutter test 2>&1 | tee /tmp/tst.out || true
          echo "=== TEST OUT (annotations, first 60 lines) ==="
          grep -E "." /tmp/tst.out 2>/dev/null | head -60 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit 0

      - name: Flutter build APK release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/apk.out || true
          echo "=== APK OUT (annotations, first 80 lines) ==="
          grep -E "." /tmp/apk.out 2>/dev/null | head -80 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit 0

      - name: Verify APK metadata
        run: |
          {
            set +e
            APK="$(find build -name app-release.apk -type f | head -1)"
            echo "APK_PATH=$APK"
            ls -la "$APK" 2>&1
            echo "=== Manifest (annotations) ==="
            unzip -p "$APK" AndroidManifest.xml 2>&1 | grep -aE 'package=|versionCode=|versionName=' | head -5
            echo "=== MainActivity.kt ==="; cat android/app/src/main/MainActivity.kt 2>&1
            echo "=== FlutterActivity.kt ==="; cat android/app/src/main/FlutterActivity.kt 2>&1
            echo "=== LocalActivity refs ==="; grep -rn "MainActivity\|FlutterActivity" android/ lib/ 2>&1 | head -12
          } | tee /tmp/verify_dump.txt
          echo "=== DUMP (annotations, first 60) ==="
          grep -E "." /tmp/verify_dump.txt 2>/dev/null | head -60 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-4.8.0-473-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
