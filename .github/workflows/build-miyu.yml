name: Build Miyu APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Miyu Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter (stable, compatible)
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.3

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format (auto-fix)
        run: dart format lib test

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Flutter build APK release
        run: |
          flutter build apk --release

      - name: Verify APK metadata
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [ -f "$APK" ] || { echo "APK_NOT_FOUND: $APK"; exit 1; }
          [ -s "$APK" ] || { echo "APK_EMPTY: $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK_FILE=$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE=$SIZE" | tee -a "$GITHUB_STEP_SUMMARY"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK_SHA256=$SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== apkanalyzer ===" | tee -a "$GITHUB_STEP_SUMMARY"
          OUT=$(apkanalyzer apk info "$APK" 2>&1)
          echo "$OUT" | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== manifest ===" | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -p "$APK" AndroidManifest.xml | grep -aE 'android:name="app\.miyu\.my\.id"|android:versionCode|android:versionName' | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
          PKG=$(unzip -p "$APK" AndroidManifest.xml 2>/dev/null | grep -oaE 'android:name="app\.miyu\.my\.id"' | head -1)
          [ -n "$PKG" ] || { echo "PACKAGE_NAME_MISMATCH"; exit 1; }
          VC=$(unzip -p "$APK" AndroidManifest.xml 2>/dev/null | grep -oaE 'android:versionCode="[0-9]+"' | head -1 | grep -oaE '[0-9]+')
          VN=$(unzip -p "$APK" AndroidManifest.xml 2>/dev/null | grep -oaE 'android:versionName="[^"]*"' | head -1 | grep -oaE '"[^"]*"' | tr -d '"')
          echo "APK_VERSION_CODE=$VC" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK_VERSION_NAME=$VN" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$VC" = "473" ] || { echo "VC_MISMATCH=$VC"; exit 1; }
          [ "$VN" = "4.8.0" ] || { echo "VN_MISMATCH=$VN"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-4.8.0-473-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
          merge-multiple: false

      - name: Emit verified run summary
        run: |
          {
            echo "## MIYU build summary"
            echo "APK_FILE=build/app/outputs/flutter-apk/app-release.apk"
            echo "APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk 2>/dev/null)"
            echo "APK_SHA256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
