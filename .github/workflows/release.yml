name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.2.0)"
        required: true
        default: "1.0.0"
      release_notes:
        description: "Release notes"
        required: false
        default: "Miyu Android release"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.32.8"

jobs:
  build-release:
    name: Build signed APK & publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Gradle wrapper
        run: bash tool/setup_android_wrapper.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION"

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "${GOOGLE_SERVICES_JSON}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json configured — FCM enabled"
          else
            echo "::notice::GOOGLE_SERVICES_JSON not set — release built without Firebase push"
          fi

      - name: Configure release signing (only when keystore secrets exist)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::notice::Signing secrets missing — building with debug signing"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/miyu-release.jks"
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          {
            echo "storeFile=${KEYSTORE_PATH}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release --no-pub \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE_URL="${API_BASE_URL:-https://api.miyu.app}" \
            --dart-define=SOCKET_URL="${SOCKET_URL:-https://api.miyu.app}" \
            --dart-define=APP_ENV="${APP_ENV:-production}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.version }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}"

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/miyu-${{ steps.version.outputs.version }}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyu-release-${{ steps.version.outputs.version }}
          path: mobile/dist/*.apk
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Miyu v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Miyu ${{ steps.version.outputs.version }}

            ${{ github.event.inputs.release_notes }}

            **Build info**
            - Signed: `${{ steps.signing.outputs.signed }}`
            - Commit: `${{ github.sha }}`
            - Flutter: `${{ env.FLUTTER_VERSION }}`
          files: mobile/dist/*.apk
          draft: false
          prerelease: false
