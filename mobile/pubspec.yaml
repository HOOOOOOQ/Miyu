name: miyu
description: "Miyu — a premium glassmorphic instant messaging app for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3

  # Networking & realtime
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Auth
  google_sign_in: ^6.2.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  # Media & calls
  flutter_webrtc: ^0.12.5
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  record: ^5.1.2
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  open_filex: ^4.5.0

  # Platform & storage
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2

  # UI
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
